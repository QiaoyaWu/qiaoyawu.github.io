<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../talkmap/leaflet_dist/MarkerCluster.css">
  <link rel="stylesheet" href="../talkmap/leaflet_dist/MarkerCluster.Default.css">
  <style>
    html,
    body,
    #map {
      height: 100%;
      margin: 0;
    }

    body {
      background: #f8fafc;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .leaflet-container {
      background: #eef4f7;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .travel-popup strong {
      display: block;
      margin-bottom: 0.15rem;
    }

    .travel-marker {
      align-items: center;
      background: #bc4b51;
      border: 2px solid #fff;
      border-radius: 999px;
      box-shadow: 0 1px 6px rgba(30, 41, 59, 0.28);
      display: flex;
      height: 15px;
      justify-content: center;
      width: 15px;
    }

    .travel-marker::after {
      border: 1px solid rgba(188, 75, 81, 0.35);
      border-radius: 999px;
      content: "";
      height: 25px;
      position: absolute;
      width: 25px;
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Interactive map of places visited"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../talkmap/leaflet_dist/leaflet.markercluster.js"></script>
  <script>
    const map = L.map("map", {
      center: [24, 15],
      zoom: 2,
      minZoom: 2,
      maxZoom: 7,
      scrollWheelZoom: false,
      worldCopyJump: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markerIcon = L.divIcon({
      className: "",
      html: '<span class="travel-marker"></span>',
      iconSize: [25, 25],
      iconAnchor: [12, 12],
      popupAnchor: [0, -10]
    });

    const markers = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 35
    });

    function parseCsvLine(line) {
      const values = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i += 1) {
        const char = line[i];
        const nextChar = line[i + 1];

        if (char === '"' && inQuotes && nextChar === '"') {
          value += '"';
          i += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          values.push(value);
          value = "";
        } else {
          value += char;
        }
      }

      values.push(value);
      return values;
    }

    function parseCsv(text) {
      const rows = text.trim().split(/\r?\n/).filter((row) => row.trim().length > 0);
      const headers = parseCsvLine(rows.shift()).map((header) => header.trim());

      return rows.map((row) => {
        const values = parseCsvLine(row);
        return headers.reduce((entry, header, index) => {
          entry[header] = (values[index] || "").trim();
          return entry;
        }, {});
      }).filter((entry) => entry.name && entry.latitude && entry.longitude);
    }

    fetch("visited-countries.csv")
      .then((response) => response.text())
      .then((csvText) => {
        const visitedPlaces = parseCsv(csvText);

        visitedPlaces.forEach((place) => {
          const label = `<strong>${place.name}</strong><br />${place.note}`;
          const marker = L.marker([Number(place.latitude), Number(place.longitude)], {
            icon: markerIcon,
            title: place.name
          }).bindPopup(`<div class="travel-popup">${label}</div>`);
          markers.addLayer(marker);
        });

        map.addLayer(markers);
        map.fitBounds(markers.getBounds().pad(0.28));
      });
  </script>
</body>
</html>
